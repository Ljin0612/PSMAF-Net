# Merge this file after Detectron2's COCO-Detection/faster_rcnn_R_50_FPN_3x.yaml.
MODEL:
  BACKBONE:
    NAME: UNIVBackbone
    FREEZE_AT: 0
  UNIV:
    CHECKPOINT: ""
    FREEZE: false
    PRETRAIN_IMAGE_SIZE: 224
    OUT_CHANNELS: 256
    DROP_PATH_RATE: 0.2
  MASK_ON: false
  # M3FD IR is loaded as replicated 8-bit channels. These values implement the
  # official UNIV IR normalization mean=0.5338, std=0.2519 on Detectron2's 0-255 input.
  PIXEL_MEAN: [136.119, 136.119, 136.119]
  PIXEL_STD: [64.2345, 64.2345, 64.2345]
  PROPOSAL_GENERATOR:
    NAME: RPN
  ANCHOR_GENERATOR:
    SIZES: [[32], [64], [128], [256]]
  RPN:
    IN_FEATURES: [p2, p3, p4, p5]
  ROI_HEADS:
    IN_FEATURES: [p2, p3, p4, p5]
    NUM_CLASSES: 6

INPUT:
  MIN_SIZE_TRAIN: [1024]
  MAX_SIZE_TRAIN: 1024
  MIN_SIZE_TEST: 1024
  MAX_SIZE_TEST: 1024

SOLVER:
  BASE_LR: 0.00008
  IMS_PER_BATCH: 1
  STEPS: []

TEST:
  EVAL_PERIOD: 0
